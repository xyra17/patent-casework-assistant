name: tanyuan

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_DEV_ROOT_PASSWORD:?请在 .env 设置开发库 root 密码}
      MYSQL_DATABASE: department_workbench
      MYSQL_USER: tanyuan_reader
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请设置 MYSQL_PASSWORD}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3300}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./sql/readonly.sql:/docker-entrypoint-initdb.d/02-readonly.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h localhost -u root --silent"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      VECTOR_STORE_DIR: /app/data/department/company-vector-store
      KNOWLEDGE_BASE_DIR: /app/知识库文件/90_公司文档
      SEMANTIC_AUTO_INTROSPECT: "1"
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    volumes:
      - ./data:/app/data
      - ./output:/app/output
      - ./upload:/app/upload
      - ./知识库文件:/app/知识库文件:ro
      - ./models:/app/models
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped


  proxy:
    image: caddy:2.10-alpine
    depends_on:
      app:
        condition: service_healthy
    env_file:
      - .env
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
      HTTP_PORT: ${HTTP_PORT:-8080}
      HTTPS_PORT: ${HTTPS_PORT:-8443}
      APP_UPSTREAM: app:8000
    ports:
      - "${HTTP_PORT:-8080}:${HTTP_PORT:-8080}"
      - "${HTTPS_PORT:-8443}:${HTTPS_PORT:-8443}"
    volumes:
      - ${CADDYFILE:-./deploy/Caddyfile}:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  mysql_data:
  caddy_data:
  caddy_config:
