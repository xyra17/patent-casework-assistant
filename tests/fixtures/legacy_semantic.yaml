version: 1
name: 企业业务数据
description: 通用业务分析语义层；当前仓库自带药品/库存/销售 demo 数据，替换 MYSQL_* 后可被自动发现补全。
default_timezone: Asia/Shanghai

tables:
  drugs:
    label: 药品主数据
    description: 药品基础信息表，一行一个药品。
    primary_key: drug_id
    columns:
      drug_id:
        label: 药品ID
        role: id
        type: integer
        description: 药品唯一标识
      generic_name:
        label: 通用名
        role: dimension
        hierarchy: product
        synonyms: [药品名称, 品名]
      brand_name:
        label: 商品名
        role: dimension
        synonyms: [品牌]
      approval_number:
        label: 批准文号
        role: id
      specifications:
        label: 规格
        role: attribute
      dosage_form:
        label: 剂型
        role: dimension
        hierarchy: product
        synonyms: [剂型分类]
      manufacturer:
        label: 生产厂家
        role: dimension
      therapeutic_area:
        label: 治疗领域
        role: dimension
        hierarchy: product
        synonyms: [领域, 适应症领域, 治疗类别]
      description:
        label: 说明
        role: text
      created_at:
        label: 创建时间
        role: time
        type: datetime

  inventory:
    label: 库存
    description: 按药品和批次记录当前库存。
    primary_key: inventory_id
    columns:
      inventory_id:
        label: 库存ID
        role: id
      drug_id:
        label: 药品ID
        role: foreign_key
        references: drugs.drug_id
      batch_number:
        label: 生产批号
        role: id
      quantity_on_hand:
        label: 库存数量
        role: metric
        aggregation: sum
        unit: 盒
      warehouse_location:
        label: 仓库位置
        role: geo
        geo_type: warehouse
        synonyms: [仓库, 库房]
      production_date:
        label: 生产日期
        role: time
        type: date
      expiry_date:
        label: 有效期至
        role: time
        type: date
      last_updated:
        label: 更新时间
        role: time
        type: datetime

  sales_records:
    label: 销售记录
    description: 一行一条销售明细。
    primary_key: sale_id
    columns:
      sale_id:
        label: 销售ID
        role: id
      drug_id:
        label: 药品ID
        role: foreign_key
        references: drugs.drug_id
      sale_date:
        label: 销售日期
        role: time
        type: date
      quantity_sold:
        label: 销售数量
        role: metric
        aggregation: sum
        unit: 盒
      unit_price:
        label: 单价
        role: metric
        aggregation: avg
        unit: 元
      total_amount:
        label: 销售总额
        role: metric
        aggregation: sum
        unit: 元
        synonyms: [销售额, 金额, 营收]
      customer_name:
        label: 客户名称
        role: dimension
      region:
        label: 销售区域
        role: geo
        geo_type: region
        synonyms: [区域, 大区]
      sales_rep:
        label: 销售代表
        role: dimension

relationships:
  - from: inventory.drug_id
    to: drugs.drug_id
    type: many_to_one
    label: 库存所属药品
  - from: sales_records.drug_id
    to: drugs.drug_id
    type: many_to_one
    label: 销售所属药品

metrics:
  drug_count:
    label: 药品数量
    table: drugs
    expression: COUNT(DISTINCT drug_id)
    format: integer
    synonyms: [药品数, 品种数, 药品总数]
  total_sales:
    label: 销售总额
    table: sales_records
    expression: SUM(total_amount)
    format: currency
    unit: 元
    synonyms: [销售额, 营收, 销售金额]
  sales_quantity:
    label: 销售数量
    table: sales_records
    expression: SUM(quantity_sold)
    format: integer
    unit: 盒
    synonyms: [销量, 销售件数]
  inventory_quantity:
    label: 库存总量
    table: inventory
    expression: SUM(quantity_on_hand)
    format: integer
    unit: 盒
    synonyms: [库存, 库存量]
  avg_unit_price:
    label: 平均单价
    table: sales_records
    expression: AVG(unit_price)
    format: currency
    unit: 元

hierarchies:
  product:
    label: 产品层级
    table: drugs
    levels: [therapeutic_area, dosage_form, generic_name, drug_id]
    description: 治疗领域 → 剂型 → 通用名 → 药品
  time:
    label: 时间层级
    table: sales_records
    levels: [year, quarter, month, day]
    level_expressions:
      year: "YEAR(sale_date)"
      quarter: "CONCAT(YEAR(sale_date), '-Q', QUARTER(sale_date))"
      month: "DATE_FORMAT(sale_date, '%Y-%m')"
      day: "DATE(sale_date)"
    description: 年 → 季 → 月 → 日（基于 sale_date 派生）
  geo:
    label: 地区层级
    table: sales_records
    levels: [region, customer_name]
    description: 销售区域 → 客户；当前区域名不是标准行政区编码，地图需额外 GeoJSON/映射

roles:
  allowed: [id, foreign_key, dimension, metric, time, geo, stage, source, target, attribute, text]
