{{- if .Values.secret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "patent-casework-assistant.fullname" . }}
  labels:
    {{- include "patent-casework-assistant.labels" . | nindent 4 }}
type: Opaque
stringData:
  DEEPSEEK_API_KEY: {{ .Values.secret.DEEPSEEK_API_KEY | quote }}
  TAVILY_API_KEY: {{ .Values.secret.TAVILY_API_KEY | quote }}
  MYSQL_IMPORT_PASSWORD: {{ .Values.secret.MYSQL_IMPORT_PASSWORD | quote }}
  MYSQL_PASSWORD: {{ .Values.secret.MYSQL_PASSWORD | quote }}
  MYSQL_DEV_ROOT_PASSWORD: {{ .Values.secret.MYSQL_DEV_ROOT_PASSWORD | quote }}
{{- end }}
