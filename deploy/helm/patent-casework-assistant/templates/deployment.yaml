{{- if gt (int .Values.replicaCount) 1 }}
{{- fail "patent-casework-assistant uses local SQLite/Chroma; replicaCount > 1 requires external state backends first" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "patent-casework-assistant.fullname" . }}
  labels:
    {{- include "patent-casework-assistant.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  # SQLite/Chroma 在本地卷上不是多 Pod 安全的；升级时先停旧 Pod。
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "patent-casework-assistant.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "patent-casework-assistant.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "patent-casework-assistant.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: 60
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "patent-casework-assistant.fullname" . }}
            - secretRef:
                name: {{ include "patent-casework-assistant.secretName" . }}
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
            failureThreshold: 18
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: output
              mountPath: /app/output
            - name: upload
              mountPath: /app/upload
            - name: vector
              mountPath: /app/vector_store
            - name: models
              mountPath: /app/models
            - name: knowledge
              mountPath: /app/knowledge_base
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.data.existingClaim | default (printf "%s-data" (include "patent-casework-assistant.fullname" $)) }}
        - name: output
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.output.existingClaim | default (printf "%s-output" (include "patent-casework-assistant.fullname" $)) }}
        - name: upload
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.upload.existingClaim | default (printf "%s-upload" (include "patent-casework-assistant.fullname" $)) }}
        - name: vector
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.vector.existingClaim | default (printf "%s-vector" (include "patent-casework-assistant.fullname" $)) }}
        - name: models
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.models.existingClaim | default (printf "%s-models" (include "patent-casework-assistant.fullname" $)) }}
        - name: knowledge
          {{- if .Values.knowledgeBase.existingClaim }}
          persistentVolumeClaim:
            claimName: {{ .Values.knowledgeBase.existingClaim }}
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
