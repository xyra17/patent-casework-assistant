replicaCount: 1

image:
  repository: patent-casework-assistant
  tag: "1.0.0"
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podSecurityContext:
  fsGroup: 10001
  fsGroupChangePolicy: OnRootMismatch
securityContext:
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  runAsUser: 10001
  readOnlyRootFilesystem: false
  capabilities:
    drop: ["ALL"]

service:
  type: ClusterIP
  port: 8000

ingress:
  enabled: false
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  host: patent-casework-assistant.example.com
  path: /
  pathType: Prefix
  tls:
    enabled: true
    secretName: patent-casework-assistant-tls

config:
  DEEPSEEK_MODEL: deepseek-flash
  DEEPSEEK_BASE_URL: https://api.deepseek.com
  MYSQL_HOST: mysql.example.internal
  MYSQL_PORT: "3306"
  MYSQL_IMPORT_USER: ""
  MYSQL_USER: patent-casework-assistant_reader
  MYSQL_DATABASE: department_workbench
  MYSQL_CHARSET: utf8mb4
  EMBEDDING_MODEL: Qwen/Qwen3-Embedding-0.6B
  EMBEDDING_MODEL_PATH: /app/models/Qwen3-Embedding-0.6B
  CASEWORK_RERANKER_MODEL_PATH: /app/models/bge-reranker-base
  CASEWORK_RERANKER_MAX_TOKENS: "512"
  CASEWORK_RERANKER_CANDIDATES: "20"
  CASEWORK_RERANKER_MIN_LOGIT: "-0.8682041168212891"
  VECTOR_STORE_DIR: /app/data/department/company-vector-store
  KNOWLEDGE_BASE_DIR: /app/知识库文件/90_公司文档
  PDF_BACKEND: reportlab
  TASK_TIMEOUT: "900"
  WEB_SEARCH_LIMIT: "3"
  KNOWLEDGE_SEARCH_LIMIT: "6"
  SEMANTIC_AUTO_INTROSPECT: "1"

# 生产密钥不要写进 values；建议 externalSecrets/SealedSecrets，或 kubectl create secret。
secret:
  create: true
  existingSecret: ""
  DEEPSEEK_API_KEY: ""
  TAVILY_API_KEY: ""
  MYSQL_IMPORT_PASSWORD: ""
  MYSQL_PASSWORD: ""
  MYSQL_DEV_ROOT_PASSWORD: ""

persistence:
  enabled: true
  data:
    size: 5Gi
    accessMode: ReadWriteOnce
    storageClass: ""
    existingClaim: ""
  output:
    size: 10Gi
    accessMode: ReadWriteOnce
    storageClass: ""
    existingClaim: ""
  upload:
    size: 5Gi
    accessMode: ReadWriteOnce
    storageClass: ""
    existingClaim: ""
  vector:
    size: 10Gi
    accessMode: ReadWriteOnce
    storageClass: ""
    existingClaim: ""
  models:
    size: 5Gi
    accessMode: ReadWriteOnce
    storageClass: ""
    existingClaim: ""

knowledgeBase:
  # 知识库原文需要单独准备；为空时使用 emptyDir，仅适合无知识库的演示。
  existingClaim: ""

resources:
  requests:
    cpu: 500m
    memory: 2Gi
  limits:
    cpu: "2"
    memory: 6Gi

nodeSelector: {}
tolerations: []
affinity: {}

pdb:
  enabled: true
  minAvailable: 1
