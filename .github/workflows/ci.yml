name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.2"
          pip install -e . pytest
      - name: Unit and feature tests
        run: python scripts/test_backend.py discover -s tests -v
      - name: Pytest scenarios
        run: python -m pytest -q tests/test_attachment_comparison.py tests/test_casework_vertical_forms.py tests/test_multimodal_documents.py tests/test_result_assessment.py tests/test_verification_false_blocks.py tests/test_statistics_check.py

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build

  helm:
    name: Helm chart validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.17.3
      - name: Lint and render
        run: |
          helm lint deploy/helm/patent-casework-assistant
          helm template ci deploy/helm/patent-casework-assistant \
            --set ingress.enabled=true \
            --set ingress.host=patent-casework-assistant.example.com > /tmp/patent-casework-assistant.yaml
      - name: Validate Caddy configs
        run: |
          docker run --rm -v "$PWD/deploy":/deploy:ro caddy:2.10-alpine \
            caddy validate --config /deploy/Caddyfile --adapter caddyfile
          docker run --rm -v "$PWD/deploy":/deploy:ro caddy:2.10-alpine \
            caddy validate --config /deploy/Caddyfile.prod --adapter caddyfile

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    needs: [backend, frontend, helm]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: patent-casework-assistant:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
